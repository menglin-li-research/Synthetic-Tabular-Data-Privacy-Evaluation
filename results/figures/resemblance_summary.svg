<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640">
  <rect width="1100" height="640" fill="#ffffff"/>
  <text x="60" y="58" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#111827">Statistical resemblance across two datasets</text>
  <text x="60" y="92" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#4b5563">Lower values indicate closer agreement on the selected aggregate diagnostics.</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="180" y="150" font-size="18" font-weight="700" fill="#374151">Metric</text>
    <text x="570" y="150" font-size="18" font-weight="700" fill="#1f4e79">Pima</text>
    <text x="815" y="150" font-size="18" font-weight="700" fill="#6a4c93">Contraceptive</text>
  </g>
  <line x1="150" y1="170" x2="960" y2="170" stroke="#d1d5db" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111827">
    <text x="180" y="240">Mean KS statistic</text>
    <text x="180" y="345">Mean absolute SMD</text>
    <text x="180" y="450">Correlation RMSE</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="middle">
    <text x="590" y="240" fill="#1f4e79">0.0823</text>
    <text x="835" y="240" fill="#6a4c93">0.0126</text>
    <text x="590" y="345" fill="#1f4e79">0.0521</text>
    <text x="835" y="345" fill="#6a4c93">0.0180</text>
    <text x="590" y="450" fill="#1f4e79">0.0628</text>
    <text x="835" y="450" fill="#6a4c93">0.0585</text>
  </g>
  <g fill="#eef3f8">
    <rect x="530" y="260" width="120" height="12" rx="6"/><rect x="775" y="260" width="120" height="12" rx="6"/>
    <rect x="530" y="365" width="120" height="12" rx="6"/><rect x="775" y="365" width="120" height="12" rx="6"/>
    <rect x="530" y="470" width="120" height="12" rx="6"/><rect x="775" y="470" width="120" height="12" rx="6"/>
  </g>
  <rect x="530" y="260" width="99" height="12" rx="6" fill="#1f4e79"/><rect x="775" y="260" width="15" height="12" rx="6" fill="#6a4c93"/>
  <rect x="530" y="365" width="63" height="12" rx="6" fill="#1f4e79"/><rect x="775" y="365" width="22" height="12" rx="6" fill="#6a4c93"/>
  <rect x="530" y="470" width="75" height="12" rx="6" fill="#1f4e79"/><rect x="775" y="470" width="70" height="12" rx="6" fill="#6a4c93"/>
  <rect x="160" y="520" width="800" height="64" rx="14" fill="#f8fafc" stroke="#e5e7eb"/>
  <text x="560" y="558" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#374151">Aggregate resemblance looks strong, but it should not be used as a proxy for privacy.</text>
</svg>