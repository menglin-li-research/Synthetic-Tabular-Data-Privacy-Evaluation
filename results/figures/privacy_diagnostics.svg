<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640">
  <rect width="1100" height="640" fill="#ffffff"/>
  <text x="60" y="58" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#111827">Privacy diagnostics are dataset-dependent</text>
  <text x="60" y="92" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#4b5563">Exact matches and attack accuracy tell a different story from utility alone.</text>

  <rect x="70" y="135" width="455" height="410" rx="18" fill="#f8fafc" stroke="#dbe4ee"/>
  <text x="105" y="180" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#1f4e79">Pima Indians Diabetes</text>
  <text x="105" y="225" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6b7280">Exact-match rate</text>
  <text x="105" y="278" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#111827">0.00%</text>
  <text x="105" y="332" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6b7280">Membership-inference accuracy</text>
  <text x="105" y="385" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#111827">0.47–0.51</text>
  <rect x="105" y="430" width="350" height="66" rx="12" fill="#eaf4ec"/>
  <text x="125" y="457" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#236b3c">Interpretation</text>
  <text x="125" y="482" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#2f4f3a">Attack accuracy is close to chance in this setup.</text>

  <rect x="575" y="135" width="455" height="410" rx="18" fill="#f8fafc" stroke="#dbe4ee"/>
  <text x="610" y="180" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#1f4e79">Contraceptive Method Choice</text>
  <text x="610" y="225" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6b7280">Exact-match rate</text>
  <text x="610" y="278" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#111827">2.55%</text>
  <text x="610" y="332" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6b7280">Membership-inference accuracy</text>
  <text x="610" y="385" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#111827">0.51–0.62</text>
  <rect x="610" y="430" width="350" height="66" rx="12" fill="#fff4e5"/>
  <text x="630" y="457" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#9a5b00">Caution</text>
  <text x="630" y="482" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#7a4d12">Discrete variables make exact matching more common.</text>

  <text x="550" y="590" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#374151">Synthetic ≠ automatically private. Privacy depends on the dataset, generator, threat model, and attack.</text>
</svg>