<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640">
  <rect width="1100" height="640" fill="#ffffff"/>
  <text x="60" y="58" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#111827">Utility retention: TRTR vs TSTR ROC-AUC</text>
  <text x="60" y="92" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#4b5563">Synthetic training data preserve most of the real-data predictive performance in both datasets.</text>
  <line x1="110" y1="520" x2="1030" y2="520" stroke="#9ca3af" stroke-width="2"/>
  <line x1="110" y1="150" x2="110" y2="520" stroke="#9ca3af" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6b7280">
    <text x="72" y="525">0.0</text><text x="72" y="451">0.2</text><text x="72" y="377">0.4</text><text x="72" y="303">0.6</text><text x="72" y="229">0.8</text><text x="72" y="155">1.0</text>
  </g>
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="110" y1="446" x2="1030" y2="446"/><line x1="110" y1="372" x2="1030" y2="372"/>
    <line x1="110" y1="298" x2="1030" y2="298"/><line x1="110" y1="224" x2="1030" y2="224"/><line x1="110" y1="150" x2="1030" y2="150"/>
  </g>
  <rect x="250" y="219" width="105" height="301" rx="8" fill="#1f4e79"/>
  <rect x="365" y="231" width="105" height="289" rx="8" fill="#6aaed6"/>
  <rect x="675" y="249" width="105" height="271" rx="8" fill="#1f4e79"/>
  <rect x="790" y="259" width="105" height="261" rx="8" fill="#6aaed6"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">
    <text x="302.5" y="207">0.813</text><text x="417.5" y="219">0.782</text>
    <text x="727.5" y="237">0.733</text><text x="842.5" y="247">0.706</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#111827" text-anchor="middle">
    <text x="360" y="557">Pima Indians Diabetes</text>
    <text x="785" y="557">Contraceptive Method Choice</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#4b5563">
    <rect x="760" y="100" width="18" height="18" rx="3" fill="#1f4e79"/><text x="788" y="114">TRTR (train real, test real)</text>
    <rect x="760" y="126" width="18" height="18" rx="3" fill="#6aaed6"/><text x="788" y="140">TSTR (train synthetic, test real)</text>
  </g>
  <g>
    <rect x="238" y="582" width="244" height="38" rx="19" fill="#eef6fb"/><text x="360" y="607" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1f4e79">96.16% ROC-AUC retained</text>
    <rect x="663" y="582" width="244" height="38" rx="19" fill="#eef6fb"/><text x="785" y="607" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1f4e79">96.28% ROC-AUC retained</text>
  </g>
</svg>