name: baseline-ci

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "requirements.txt"
      - "environment.yml"
      - ".github/workflows/baseline.yml"
  workflow_dispatch:

jobs:
  run-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run baseline
        run: |
          python -m src.download_data
          python -m src.run_baseline

      - name: Show generated summary
        run: |
          cat results/tables/combined_gaussian_baseline_summary.json

      - name: Upload baseline artifacts
        uses: actions/upload-artifact@v4
        with:
          name: two-dataset-gaussian-baseline-results
          path: |
            results/tables/
            data/synthetic/
