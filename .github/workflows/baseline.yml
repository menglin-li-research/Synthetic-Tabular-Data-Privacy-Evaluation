name: baseline-ci

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  run-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run baseline
        run: |
          python -m src.download_data
          python -m src.run_baseline

      - name: Show generated summary
        run: |
          cat results/tables/pima_gaussian_baseline_summary.json

      - name: Upload baseline artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pima-gaussian-baseline-results
          path: |
            results/tables/
            data/synthetic/
